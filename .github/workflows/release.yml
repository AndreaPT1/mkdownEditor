name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            name: 'macOS Apple Silicon'
          - platform: macos-13
            args: '--target x86_64-apple-darwin'
            name: 'macOS Intel'
          - platform: windows-latest
            args: ''
            name: 'Windows'
          - platform: ubuntu-22.04
            args: ''
            name: 'Linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'mkdownEditor ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `mkdownEditor_*_aarch64.dmg` |
            | macOS (Intel) | `mkdownEditor_*_x64.dmg` |
            | Windows | `mkdownEditor_*_x64-setup.exe` |
            | Linux | `mkdownEditor_*_amd64.AppImage` |

            ### macOS note
            At first launch, right-click the app → Open to bypass Gatekeeper.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
