[package]
name = "mkdown-editor"
version = "0.3.2"
description = "A small desktop Markdown editor"
authors = ["Andrea Giansanti"]
edition = "2021"

[lib]
# Keep the library name distinct from the binary name for Windows builds.
# https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
