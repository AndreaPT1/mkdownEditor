name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            name: 'Windows'
          - platform: ubuntu-22.04
            args: ''
            name: 'Linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'mkdownEditor ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `mkdownEditor_*_native-macos-arm64.zip` |
            | Windows | `mkdownEditor_*_x64-setup.exe` |
            | Linux | `mkdownEditor_*_amd64.AppImage` |

            ### Windows SmartScreen note
            Windows Defender SmartScreen may warn that mkdownEditor is unrecognized while Windows releases are unsigned or still building publisher reputation. Only install downloads from this official GitHub release.

            ### macOS note
            The macOS build is now Swift-native and Apple Silicon only. At first launch, right-click the app → Open to bypass Gatekeeper while builds are unsigned.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  native-macos:
    name: Native macOS Apple Silicon
    needs: build
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      - name: Generate native Xcode project
        run: xcodegen generate
        working-directory: macos-native

      - name: Build native macOS app
        run: |
          xcodebuild \
            -project mkdownEditorNative.xcodeproj \
            -scheme mkdownEditorNative \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: macos-native

      - name: Package native macOS app
        run: |
          ditto -c -k --keepParent \
            build/Build/Products/Release/mkdownEditorNative.app \
            "mkdownEditor_${GITHUB_REF_NAME}_native-macos-arm64.zip"
        working-directory: macos-native

      - name: Upload native macOS release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${GITHUB_REF_NAME}" \
            "mkdownEditor_${GITHUB_REF_NAME}_native-macos-arm64.zip" \
            --clobber
        working-directory: macos-native
